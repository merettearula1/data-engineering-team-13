
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: warehouse_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: airflow
      WAREHOUSE_DB: warehouse
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse_admin -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  warehouse-init:
    image: postgres:16
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: warehouse_admin
      POSTGRES_DB: airflow
      WAREHOUSE_DB: warehouse
    volumes:
      - ./sql/init:/opt/warehouse-init:ro
    command: ["bash", "/opt/warehouse-init/01_create_warehouse.sh"]

  airflow-init:
    build: .
    restart: "no"
    depends_on:
      warehouse-init:
        condition: service_completed_successfully
    environment: &airflow-common-env
      # Airflow core
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Shared security keys
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?Set AIRFLOW_JWT_SECRET in .env}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY:?Set AIRFLOW_API_SECRET_KEY in .env}
      # Database
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://warehouse_admin:${POSTGRES_PASSWORD}@postgres:5432/airflow
      # Admin account
      AIRFLOW_ADMIN_USERNAME: ${AIRFLOW_ADMIN_USERNAME:-admin}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?Set AIRFLOW_ADMIN_PASSWORD in .env}
      AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
      # Warehouse connection
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: warehouse_admin
      WAREHOUSE_PASSWORD: ${POSTGRES_PASSWORD}
      WAREHOUSE_DB: warehouse
      WAREHOUSE_DATABASE_URL: postgresql+psycopg2://warehouse_admin:${POSTGRES_PASSWORD}@postgres:5432/warehouse
      # dbt
      DBT_VENV_PATH: /opt/airflow/dbt_venv
      DBT_PROFILES_DIR: /opt/airflow/dbt
      DBT_TARGET_PATH: /tmp/dbt/target
      DBT_LOG_PATH: /tmp/dbt/logs

    volumes: &airflow-common-volumes
      - ./dags:/opt/airflow/dags
      - ./ingestion:/opt/airflow/ingestion
      - ./dbt:/opt/airflow/dbt:ro
      - ./logs:/opt/airflow/logs
    command:
      - bash
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "$$AIRFLOW_ADMIN_USERNAME" \
          --password "$$AIRFLOW_ADMIN_PASSWORD" \
          --firstname Warehouse \
          --lastname Admin \
          --role Admin \
          --email "$$AIRFLOW_ADMIN_EMAIL" || true

  airflow-api-server:
    build: .
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    ports:
      - "8080:8080"
    command: api-server
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    build: .
    restart: unless-stopped
    depends_on:
      airflow-api-server:
        condition: service_healthy
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: scheduler

  airflow-dag-processor:
    build: .
    restart: unless-stopped
    depends_on:
      airflow-api-server:
        condition: service_healthy
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    command: dag-processor

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:?Set PGADMIN_DEFAULT_EMAIL in .env}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?Set PGADMIN_DEFAULT_PASSWORD in .env}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  pgadmin_data:
